    <!-- INICIO DE SESIÓN -->

        <div class="bg-white/95 backdrop-blur-md p-10 rounded-3xl shadow-2xl w-full max-w-md border border-white/20">

                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 text-white font-black text-2xl shadow-lg shadow-blue-600/30 mb-4">AE</div>

                <button onclick="switchLoginTab('student')" id="tab-student-btn" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-900">Estudiante</button>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Contraseña</label>
                    <input type="password" id="admin-pass" value="admin2026" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white focus:outline-none transition text-sm font-medium">
                </div>
                <button onclick="loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold transition-all duration-200 shadow-lg shadow-blue-600/30 text-sm mt-2">Ingresar como Administrador</button>
            </div>

            <div id="form-student" class="space-y-4 hidden">

                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Número de DNI (8 Dígitos)</label>
                    <input type="text" id="student-dni" placeholder="Ej. 74839201" maxlength="8" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:bg-white focus:outline-none transition text-sm font-medium">
                </div>
                <p class="text-[11px] text-slate-400 font-medium">Acceso exclusivo para alumnos matriculados.</p>
                <button onclick="loginStudent()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold transition-all duration-200 shadow-lg shadow-indigo-600/30 text-sm mt-2">Entrar a mi Portal</button>
            </div>

    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-900 text-white shadow-lg flex justify-between items-center px-8 py-4 border-b border-slate-800">
            <div class="flex items-center space-x-4">
                <span class="text-lg font-black tracking-wider text-blue-400">Academia Excellence</span>
                <span id="user-role-badge" class="bg-blue-600/30 border border-blue-400/30 text-blue-300 text-[10px] px-3 py-1 rounded-full uppercase font-black tracking-widest">Rol</span>
            </div>
            <div class="flex items-center space-x-6">
                <span id="welcome-user" class="text-xs font-semibold text-slate-300"></span>
                <button onclick="logout()" class="bg-red-500/10 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/20 text-xs px-4 py-2 rounded-xl font-bold transition-all duration-200">Cerrar Sesión</button>
            </div>
        </header>

        <div class="flex flex-1 flex-col md:flex-row">
            <aside class="w-full md:w-72 bg-white border-r border-slate-200 p-6 space-y-2 shadow-sm" id="sidebar-menu"></aside>
            <main class="flex-1 p-8 md:p-12 overflow-y-auto bg-slate-100" id="main-content-area"></main>
        </div>
    </div>

    <script>
        let currentUser = null;
        let dbEstudiantes = [
            { dni: "74839201", nombres: "Carlos Daniel", apellidos: "Mendoza Ruiz", area: "Área I", telefono: "987654321", apoderado: "Roberto Mendoza", telApoderado: "912345678" },
            { dni: "72910283", nombres: "Ana Sofía", apellidos: "Pérez Torres", area: "Área I", telefono: "923456789", apoderado: "Carmen Torres", telApoderado: "922334455" },
            { dni: "71928374", nombres: "Luis Fernando", apellidos: "Gómez Castro", area: "Área II", telefono: "934567890", apoderado: "Jorge Gómez", telApoderado: "933445566" },
            { dni: "75849302", nombres: "María Alejandra", apellidos: "Ríos Vega", area: "Área III", telefono: "945678901", apoderado: "Elena Vega", telApoderado: "944556677" },
            { dni: "73829104", nombres: "José Miguel", apellidos: "Salas Ramos", area: "Área IV", telefono: "956789012", apoderado: "Rosa Ramos", telApoderado: "955667788" }
        ];
        let dbMateriales = [
            { area: "Área I", semana: "Semana 1", titulo: "Solucionario Razonamiento Matemático Sem 1", examen: "#" },
            { area: "Área II", semana: "Semana 1", titulo: "Examen Resuelto Física y Álgebra", examen: "#" },
            { area: "General", semana: "Semana 2", titulo: "Examen Parcial Académico Resuelto Sem 2", examen: "#" },
            { area: "Área I", semana: "Semana 3", titulo: "Solucionario Biología Celular y Genética", examen: "#" }
        ];

        // Sincronización en tiempo real con Google Sheets cada 3 segundos
        setInterval(async () => {
            try {
                let res = await fetch(`${API_URL}?sheet=Estudiantes`);
                let data = await res.json();
                if(data && data.length > 1) {
                    dbEstudiantes = data.slice(1).map(r => ({
                        dni: r[0], nombres: r[1], apellidos: r[2] || "", area: r[3], telefono: r[4], apoderado: r[5], telApoderado: r[6] || ""
                    }));
                }
            } catch(e) {}
        }, 3000);

        function switchLoginTab(tipo) {
            if(tipo === 'admin') {
                document.getElementById('form-admin').classList.remove('hidden');
                document.getElementById('form-student').classList.add('hidden');
                document.getElementById('tab-admin-btn').className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 bg-white text-blue-900 shadow-md";
                document.getElementById('tab-student-btn').className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-900";
            } else {
                document.getElementById('form-admin').classList.add('hidden');
                document.getElementById('form-student').classList.remove('hidden');
                document.getElementById('tab-student-btn').className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 bg-white text-indigo-900 shadow-md";
                document.getElementById('tab-admin-btn').className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-900";
            }
        }

        async function enviarASpreadsheet(hoja, datos) {
            try {
                await fetch(`${API_URL}?sheet=${hoja}`, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
            } catch (e) { console.error(e); }
        }

        function loginAdmin() {
            if(document.getElementById('admin-user').value === "admin" && document.getElementById('admin-pass').value === "admin2026") {
                currentUser = { role: "admin" };
                initAdminPanel();
            } else {
                alert("Usuario o contraseña incorrectos.");
            }
        }

        function loginStudent() {
            let dni = document.getElementById('student-dni').value.trim();
            if(dni.length !== 8) { alert("Ingresa un DNI válido de 8 dígitos."); return; }
            let est = dbEstudiantes.find(e => e.dni === dni) || { dni, nombres: "Estudiante", apellidos: "Nuevo", area: "Área I", telefono: "999999999", apoderado: "Apoderado", telApoderado: "999999999" };
            currentUser = { role: "student", ...est };
            initStudentPanel();
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        // PANEL ADMIN
        function initAdminPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-role-badge').innerText = "Administrador / Tutora";
            document.getElementById('welcome-user').innerText = "Tutora Académica (Control Total)";

            document.getElementById('sidebar-menu').innerHTML = `
                <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider px-4 mb-2">Menú Principal</p>
                <button onclick="renderAdminDashboard()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-blue-50 hover:text-blue-600 text-slate-600 transition flex items-center space-x-3"><span>📊</span> <span>Dashboard General</span></button>
                <button onclick="renderAdminEstudiantes()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-blue-50 hover:text-blue-600 text-slate-600 transition flex items-center space-x-3"><span>👥</span> <span>Registro de Alumnos</span></button>
                <button onclick="renderAdminAsistencia()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-blue-50 hover:text-blue-600 text-slate-600 transition flex items-center space-x-3"><span>📅</span> <span>Control Asistencia</span></button>
                <button onclick="renderAdminNotas()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-blue-50 hover:text-blue-600 text-slate-600 transition flex items-center space-x-3"><span>📝</span> <span>Registro de Notas</span></button>
                <button onclick="renderAdminMateriales()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-blue-50 hover:text-blue-600 text-slate-600 transition flex items-center space-x-3"><span>📚</span> <span>Biblioteca de Exámenes</span></button>
            `;
            renderAdminDashboard();
        }

        async function guardarAsistencia() {
            let area = document.getElementById('asist-area').value;
            let fecha = document.getElementById('asist-fecha').value;
            let filtrados = dbEstudiantes.filter(e => e.area === area);
            for(let e of filtrados) {
                let radios = document.getElementsByName(`asist_${e.dni}`);
                let estado = "Presente";
                for(let r of radios) { if(r.checked) estado = r.value; }
                await enviarASpreadsheet("Asistencias", [e.dni, fecha, "Semana 1", estado, "Ninguna", area]);
            }
            alert("¡Asistencia guardada correctamente!");
        }

        function descargarReportePDFAsistencia() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let area = document.getElementById('pdf-area').value;
            let f1 = document.getElementById('pdf-f1').value;
            let f2 = document.getElementById('pdf-f2').value;

            doc.setFillColor(15, 23, 42);
            doc.rect(0, 0, 210, 28, "F");
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("REPORTE OFICIAL DE ASISTENCIA ACADÉMICA", 14, 18);

            doc.setTextColor(70, 70, 70);
            doc.setFontSize(10);
            doc.text(`Área: ${area}`, 14, 38);
            doc.text(`Rango de Fechas: ${f1} al ${f2}`, 14, 45);

            let y = 55;
            doc.setFont("helvetica", "bold");
            doc.setFillColor(241, 245, 249);
            doc.rect(14, y - 5, 182, 8, "F");
            doc.text("DNI", 16, y);
            doc.text("Estudiante", 50, y);
            doc.text("Estado", 140, y);

            y += 8;
            doc.setFont("helvetica", "normal");
            let filtrados = dbEstudiantes.filter(e => e.area === area);
            filtrados.forEach(e => {
                doc.text(e.dni, 16, y);
                doc.text((e.apellidos ? e.apellidos + ", " + e.nombres : e.nombres), 50, y);
                doc.text("Presente", 140, y);
                y += 8;
            });

            doc.save(`Reporte_Asistencia_${area.replace(" ", "_")}.pdf`);
        }

            let b = parseFloat(document.getElementById(`buenas_${dni}`).value) || 0;
