<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Excellence - Sistema Integral 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-950 font-sans text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby60WgEWfzct72N-BES63kfXDeYo-cU3SjIeyQxDA6YFRmYlPrs7yxIJNSHZhmlX-_ZoA/exec"; 
    </script>

    <!-- INICIO DE SESIÓN ÉLITE -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-blue-950 to-slate-950 p-4">
        <div class="bg-slate-900/90 backdrop-blur-xl p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-slate-800">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-black text-2xl shadow-lg shadow-indigo-500/20 mb-4 ring-2 ring-indigo-400/30">AE</div>
                <h1 class="text-2xl font-black text-white tracking-tight">Academia Excellence</h1>
                <p class="text-slate-400 text-xs mt-1 font-medium tracking-wide">Plataforma de Alta Gestión Académica</p>
            </div>

            <div class="flex rounded-2xl bg-slate-950 p-1.5 mb-6 border border-slate-800/80">
                <button onclick="switchLoginTab('admin')" id="tab-admin-btn" class="flex-1 py-3 text-xs font-bold rounded-xl transition-all duration-150 bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md">Administración</button>
                <button onclick="switchLoginTab('student')" id="tab-student-btn" class="flex-1 py-3 text-xs font-bold rounded-xl transition-all duration-150 text-slate-400 hover:text-white">Estudiante</button>
            </div>

            <div id="form-admin" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">Usuario Administrador</label>
                    <input type="text" id="admin-user" value="admin" class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-2xl text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition text-sm font-semibold">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">Contraseña</label>
                    <input type="password" id="admin-pass" value="admin2026" class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-2xl text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition text-sm font-semibold">
                </div>
                <button onclick="loginAdmin()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-4 rounded-2xl font-bold transition-all duration-150 shadow-xl shadow-indigo-600/30 text-xs uppercase tracking-wider mt-2">Iniciar Sesión Admin</button>
            </div>

            <div id="form-student" class="space-y-4 hidden">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">Número de DNI (8 Dígitos)</label>
                    <input type="text" id="student-dni" placeholder="Ej. 60102454" maxlength="8" class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-2xl text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition text-sm font-semibold">
                </div>
                <p class="text-[11px] text-slate-500 font-medium">Acceso exclusivo e inmediato para alumnos matriculados.</p>
                <button onclick="loginStudent()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white py-4 rounded-2xl font-bold transition-all duration-150 shadow-xl shadow-indigo-600/30 text-xs uppercase tracking-wider mt-2">Entrar a mi Portal</button>
            </div>
        </div>
    </div>

    <!-- PANEL PRINCIPAL CORPORATIVO -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col bg-slate-950 text-slate-100">
        <header class="bg-slate-900/80 backdrop-blur-md shadow-2xl flex justify-between items-center px-8 py-4 border-b border-slate-800/80 sticky top-0 z-50">
            <div class="flex items-center space-x-4">
                <span class="text-lg font-black tracking-wider bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Academia Excellence</span>
                <span id="user-role-badge" class="bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-[10px] px-3 py-1 rounded-full uppercase font-black tracking-widest">Rol</span>
            </div>
            <div class="flex items-center space-x-6">
                <span id="welcome-user" class="text-xs font-semibold text-slate-300"></span>
                <button onclick="logout()" class="bg-rose-500/10 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/20 text-xs px-4 py-2 rounded-xl font-bold transition-all duration-150">Cerrar Sesión</button>
            </div>
        </header>

        <div class="flex flex-1 flex-col md:flex-row">
            <aside class="w-full md:w-72 bg-slate-900/50 backdrop-blur-md border-r border-slate-800/80 p-6 space-y-2" id="sidebar-menu"></aside>
            <main class="flex-1 p-8 md:p-12 overflow-y-auto bg-slate-950" id="main-content-area"></main>
        </div>
    </div>

    <script>
        let currentUser = null;
        let dbEstudiantes = [
            { dni: "60102454", nombres: "GIOVANNI", apellidos: "SOTO CAMPOS", area: "Área I", telefono: "930268614", apoderado: "CAMPOS PAUCAR MAGALY DORIS", telApoderado: "930268614" }
        ];
        let dbNotas = [];
        let dbAsistencias = [];
        let dbMateriales = [
            { area: "Área I", semana: "Semana 1", titulo: "Solucionario Razonamiento Matemático Sem 1", examen: "#" }
        ];

        // Cargar datos sincronizados desde Google Sheets al iniciar
        async function cargarDatosRemotos() {
            try {
                let res = await fetch(`${API_URL}?sheet=Estudiantes`);
                let data = await res.json();
                if(data && data.length > 1) {
                    dbEstudiantes = data.slice(1).map(r => ({
                        dni: r[0], nombres: r[1], apellidos: r[2] || "", area: r[3], telefono: r[4], apoderado: r[5], telApoderado: r[6] || ""
                    }));
                }
            } catch(e) { console.error("Error sincronizando estudiantes", e); }
        }
        cargarDatosRemotos();

        function switchLoginTab(tipo) {
            if(tipo === 'admin') {
                document.getElementById('form-admin').classList.remove('hidden');
                document.getElementById('form-student').classList.add('hidden');
                document.getElementById('tab-admin-btn').className = "flex-1 py-3 text-xs font-bold rounded-xl transition-all duration-150 bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md";
                document.getElementById('tab-student-btn').className = "flex-1 py-3 text-xs font-bold rounded-xl transition-all duration-150 text-slate-400 hover:text-white";
            } else {
                document.getElementById('form-admin').classList.add('hidden');
                document.getElementById('form-student').classList.remove('hidden');
                document.getElementById('tab-student-btn').className = "flex-1 py-3 text-xs font-bold rounded-xl transition-all duration-150 bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-md";
                document.getElementById('tab-admin-btn').className = "flex-1 py-3 text-xs font-bold rounded-xl transition-all duration-150 text-slate-400 hover:text-white";
            }
        }

        async function enviarASpreadsheet(hoja, datos) {
            try {
                await fetch(`${API_URL}?sheet=${hoja}`, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
            } catch (e) { console.error(e); }
        }

        async function loginAdmin() {
            if(document.getElementById('admin-user').value === "admin" && document.getElementById('admin-pass').value === "admin2026") {
                await cargarDatosRemotos();
                currentUser = { role: "admin" };
                initAdminPanel();
            } else {
                alert("Usuario o contraseña incorrectos.");
            }
        }

        async function loginStudent() {
            let dni = document.getElementById('student-dni').value.trim();
            if(dni.length !== 8) { alert("Ingresa un DNI válido de 8 dígitos."); return; }
            await cargarDatosRemotos();
            let est = dbEstudiantes.find(e => e.dni === dni);
            if(!est) {
                alert("DNI no registrado en el sistema. Verifique con la tutora.");
                return;
            }
            currentUser = { role: "student", ...est };
            initStudentPanel();
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }

        function initAdminPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-role-badge').innerText = "Administrador / Tutora";
            document.getElementById('welcome-user').innerText = "Tutora Académica (Control Total)";

            document.getElementById('sidebar-menu').innerHTML = `
                <p class="text-[10px] font-black uppercase text-slate-500 tracking-widest px-4 mb-3">Menú Principal</p>
                <button onclick="renderAdminDashboard()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-slate-800 text-slate-300 transition flex items-center space-x-3"><span>📊</span> <span>Dashboard General</span></button>
                <button onclick="renderAdminEstudiantes()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-slate-800 text-slate-300 transition flex items-center space-x-3"><span>👥</span> <span>Registro de Alumnos</span></button>
                <button onclick="renderAdminAsistencia()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-slate-800 text-slate-300 transition flex items-center space-x-3"><span>📅</span> <span>Control Asistencia</span></button>
                <button onclick="renderAdminNotas()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-slate-800 text-slate-300 transition flex items-center space-x-3"><span>📝</span> <span>Registro de Notas</span></button>
                <button onclick="renderAdminMateriales()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs hover:bg-slate-800 text-slate-300 transition flex items-center space-x-3"><span>📚</span> <span>Biblioteca de Exámenes</span></button>
            `;
            renderAdminDashboard();
        }

        function renderAdminDashboard() {
            document.getElementById('main-content-area').innerHTML = `
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-2xl font-black text-white tracking-tight">Dashboard General y Estadísticas</h2>
                        <p class="text-slate-400 text-xs mt-1">Ciclo Académico 2026</p>
                    </div>
                    <span class="bg-slate-900 border border-slate-800 text-indigo-400 text-xs px-4 py-2 rounded-xl font-bold">📅 11/08/2026</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800"><p class="text-[10px] text-slate-400 font-black uppercase tracking-wider">Total Estudiantes</p><h3 class="text-3xl font-black text-indigo-400 mt-2">${dbEstudiantes.length}</h3></div>
                    <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800"><p class="text-[10px] text-slate-400 font-black uppercase tracking-wider">Promedio General</p><h3 class="text-3xl font-black text-emerald-400 mt-2">15.5</h3></div>
                    <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800"><p class="text-[10px] text-slate-400 font-black uppercase tracking-wider">Asistencia Promedio</p><h3 class="text-3xl font-black text-blue-400 mt-2">94.2%</h3></div>
                    <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800"><p class="text-[10px] text-slate-400 font-black uppercase tracking-wider">Áreas Activas</p><h3 class="text-3xl font-black text-amber-400 mt-2">4 Áreas (I - IV)</h3></div>
                </div>
            `;
        }

        function renderAdminEstudiantes() {
            document.getElementById('main-content-area').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-black text-white tracking-tight">Registro y Padrón de Estudiantes</h2>
                        <p class="text-slate-400 text-xs mt-1">Gestión corporativa de especialidades</p>
                    </div>
                    <span class="bg-slate-900 border border-slate-800 text-indigo-400 text-xs px-4 py-2 rounded-xl font-bold">📅 11/08/2026</span>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800 space-y-4">
                        <h3 class="font-bold text-white text-sm mb-2">Registrar Estudiante</h3>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Área</label>
                            <select id="reg-area" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-semibold">
                                <option value="Área I">Área I - Ciencias de la Salud</option>
                                <option value="Área II">Área II - Ingenierías</option>
                                <option value="Área III">Área III - Ciencias Económicas</option>
                                <option value="Área IV">Área IV - Humanidades y Letras</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="reg-nombres" placeholder="Nombres" class="p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-semibold">
                            <input type="text" id="reg-apellidos" placeholder="Apellidos" class="p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-semibold">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="reg-dni" placeholder="DNI (8 Dígitos)" maxlength="8" class="p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-semibold">
                            <input type="text" id="reg-tel" placeholder="Teléfono" class="p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-semibold">
                        </div>
                        <div>
                            <input type="text" id="reg-apod" placeholder="Nombre Apoderado" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-semibold mb-3">
                            <input type="text" id="reg-telapod" placeholder="Teléfono Apoderado" class="w-full p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-semibold">
                        </div>
                        <button onclick="guardarEstudiante()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white p-3.5 rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/20">Registrar en el Área</button>
                    </div>

                    <div class="lg:col-span-2 bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800">
                        <h3 class="font-bold text-white text-sm mb-4">Directorio de Estudiantes (Sincronizado)</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-950 text-slate-400 font-bold uppercase border-b border-slate-800"><th class="p-3">Estudiante / DNI</th><th class="p-3">Área</th><th class="p-3">Contacto</th><th class="p-3">Apoderado</th><th class="p-3 text-center">Acciones</th></thead>
                                <tbody class="divide-y divide-slate-800/60">
                                    ${dbEstudiantes.map((e, idx) => `
                                        <tr class="hover:bg-slate-800/40 transition">
                                            <td class="p-3"><span class="font-bold text-white">${e.apellidos}, ${e.nombres}</span><br><span class="text-[11px] text-slate-400">DNI: ${e.dni}</span></td>
                                            <td class="p-3"><span class="bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 px-3 py-1 rounded-full text-[10px] font-black">${e.area}</span></td>
                                            <td class="p-3 text-slate-300">📞 ${e.telefono}</td>
                                            <td class="p-3"><span class="font-semibold text-slate-200">${e.apoderado}</span><br><span class="text-[11px] text-slate-400">${e.telApoderado}</span></td>
                                            <td class="p-3 text-center"><button onclick="eliminarEstudiante(${idx})" class="p-2 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-xl transition">🗑️</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        async function guardarEstudiante() {
            let area = document.getElementById('reg-area').value;
            let nombres = document.getElementById('reg-nombres').value.trim();
            let apellidos = document.getElementById('reg-apellidos').value.trim();
            let dni = document.getElementById('reg-dni').value.trim();
            let telefono = document.getElementById('reg-tel').value.trim();
            let apoderado = document.getElementById('reg-apod').value.trim();
            let telApoderado = document.getElementById('reg-telapod').value.trim();

            if(!dni || !nombres) { alert("Completa DNI y Nombres."); return; }

            dbEstudiantes.push({ dni, nombres, apellidos, area, telefono, apoderado, telApoderado });
            await enviarASpreadsheet("Estudiantes", [dni, nombres, apellidos, area, telefono, apoderado, telApoderado]);
            alert("¡Estudiante registrado y guardado permanentemente en Google Sheets!");
            renderAdminEstudiantes();
        }

        function eliminarEstudiante(idx) {
            if(confirm("¿Seguro que deseas eliminar a este estudiante?")) {
                dbEstudiantes.splice(idx, 1);
                renderAdminEstudiantes();
            }
        }

        function renderAdminAsistencia() {
            document.getElementById('main-content-area').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black text-white tracking-tight">Control de Asistencia Diaria</h2>
                    <span class="bg-slate-900 border border-slate-800 text-indigo-400 text-xs px-4 py-2 rounded-xl font-bold">📅 11/08/2026</span>
                </div>
                <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800 mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <select id="asist-area" onchange="filtrarAlumnosAsistencia()" class="p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-bold">
                            <option value="Área I">Área I</option><option value="Área II">Área II</option><option value="Área III">Área III</option><option value="Área IV">Área IV</option>
                        </select>
                        <input type="date" id="asist-fecha" class="p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-bold">
                        <button onclick="guardarAsistenciaReal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition">Guardar Asistencia</button>
                    </div>
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-950 text-slate-400 font-bold uppercase border-b border-slate-800"><th class="p-3">#</th><th class="p-3">Estudiante</th><th class="p-3">DNI</th><th class="p-3 text-center">Estado</th><th class="p-3">Apoderado</th></thead>
                        <tbody class="divide-y divide-slate-800/60" id="tabla-asistencia-body"></tbody>
                    </table>
                </div>
            `;
            document.getElementById('asist-fecha').valueAsDate = new Date();
            filtrarAlumnosAsistencia();
        }

        function filtrarAlumnosAsistencia() {
            let areaSel = document.getElementById('asist-area').value;
            let filtrados = dbEstudiantes.filter(e => e.area === areaSel);
            document.getElementById('tabla-asistencia-body').innerHTML = filtrados.map((e, idx) => `
                <tr class="hover:bg-slate-800/40 transition">
                    <td class="p-3 font-bold text-slate-500">${idx + 1}</td>
                    <td class="p-3 font-bold text-white">${e.apellidos}, ${e.nombres}</td>
                    <td class="p-3 text-slate-400">${e.dni}</td>
                    <td class="p-3 text-center space-x-3">
                        <label class="font-bold text-emerald-400"><input type="radio" name="asist_${e.dni}" value="Presente" checked class="accent-emerald-500"> Presente</label>
                        <label class="font-bold text-amber-400"><input type="radio" name="asist_${e.dni}" value="Tardanza" class="accent-amber-500"> Tardanza</label>
                        <label class="font-bold text-rose-400"><input type="radio" name="asist_${e.dni}" value="Falta" class="accent-rose-500"> Falta</label>
                    </td>
                    <td class="p-3 text-slate-300">${e.apoderado}<br><span class="text-[11px] text-slate-500">${e.telApoderado}</span></td>
                </tr>
            `).join('') || `<tr><td colspan="5" class="p-6 text-center text-slate-500">No hay estudiantes en esta área.</td></tr>`;
        }

        async function guardarAsistenciaReal() {
            let fecha = document.getElementById('asist-fecha').value;
            let areaSel = document.getElementById('asist-area').value;
            let filtrados = dbEstudiantes.filter(e => e.area === areaSel);
            for(let e of filtrados) {
                let radios = document.getElementsByName(`asist_${e.dni}`);
                let estado = "Presente";
                for(let r of radios) { if(r.checked) estado = r.value; }
                dbAsistencias.push({ dni: e.dni, fecha, area: e.area, estado });
                await enviarASpreadsheet("Asistencias", [e.dni, fecha, "Semana 1", estado, "Ninguna", e.area]);
            }
            alert("¡Asistencia guardada y enviada a Google Sheets!");
        }

        function renderAdminNotas() {
            document.getElementById('main-content-area').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-black text-white tracking-tight">Registro de Notas Semanales</h2>
                        <p class="text-slate-400 text-xs mt-1">Evaluación basada en 50 preguntas ($0.4$ puntos por cada respuesta correcta).</p>
                    </div>
                    <span class="bg-slate-900 border border-slate-800 text-indigo-400 text-xs px-4 py-2 rounded-xl font-bold">📅 11/08/2026</span>
                </div>
                <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select id="notas-area" class="p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-bold" onchange="filtrarAlumnosNotas()">
                            <option value="Área I">Área I</option><option value="Área II">Área II</option><option value="Área III">Área III</option><option value="Área IV">Área IV</option>
                        </select>
                        <select id="notas-semana" class="p-3 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-bold">
                            <option value="Semana 1">Semana 1</option><option value="Semana 2">Semana 2</option><option value="Semana 3">Semana 3</option><option value="Semana 4">Semana 4</option>
                            <option value="Semana 5">Semana 5</option><option value="Semana 6">Semana 6</option><option value="Semana 7">Semana 7</option><option value="Semana 8">Semana 8</option><option value="Semana 9">Semana 9</option><option value="Semana 10">Semana 10</option>
                        </select>
                    </div>
                </div>
                <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-950 text-slate-400 font-bold uppercase border-b border-slate-800"><th class="p-3">DNI</th><th class="p-3">Estudiante</th><th class="p-3 text-center">Buenas (0-50)</th><th class="p-3 text-center">Nota Final (20)</th></tr></thead>
                        <tbody class="divide-y divide-slate-800/60" id="lista-notas-tbody"></tbody>
                    </table>
                    <button onclick="guardarNotasFinales()" class="mt-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/20">Registrar y Enviar Notas</button>
                </div>
            `;
            filtrarAlumnosNotas();
        }

        function filtrarAlumnosNotas() {
            let areaSel = document.getElementById('notas-area').value;
            let filtrados = dbEstudiantes.filter(e => e.area === areaSel);
            document.getElementById('lista-notas-tbody').innerHTML = filtrados.map(e => `
                <tr class="hover:bg-slate-800/40 transition">
                    <td class="p-3 font-bold text-white">${e.dni}</td>
                    <td class="p-3 font-semibold text-slate-300">${e.apellidos}, ${e.nombres}</td>
                    <td class="p-3 text-center"><input type="number" min="0" max="50" id="buenas_${e.dni}" oninput="calcNota('${e.dni}')" class="w-20 p-2 bg-slate-950 border border-slate-800 text-white rounded-xl text-center font-bold text-xs" placeholder="0"></td>
                    <td class="p-3 text-center font-black text-indigo-400 text-sm" id="nota_${e.dni}">0.0 / 20</td>
                </tr>
            `).join('') || `<tr><td colspan="4" class="p-6 text-center text-slate-500">No hay estudiantes en esta área.</td></tr>`;
        }

        function calcNota(dni) {
            let b = parseFloat(document.getElementById(`buenas_${dni}`).value) || 0;
            if(b > 50) b = 50;
            document.getElementById(`nota_${dni}`).innerText = (b * 0.4).toFixed(1) + " / 20";
        }

        async function guardarNotasFinales() {
            let area = document.getElementById('notas-area').value;
            let semana = document.getElementById('notas-semana').value;
            let filtrados = dbEstudiantes.filter(e => e.area === area);
            for(let e of filtrados) {
                let b = parseFloat(document.getElementById(`buenas_${e.dni}`).value) || 0;
                let notaVal = (b * 0.4).toFixed(1);
                dbNotas.push({ dni: e.dni, semana, buenas: b, nota: notaVal });
                await enviarASpreadsheet("Notas", [e.dni, semana, b, notaVal, area]);
            }
            alert("¡Notas guardadas y enviadas a Google Sheets!");
        }

        function renderAdminMateriales() {
            document.getElementById('main-content-area').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-black text-white tracking-tight">Biblioteca de Exámenes y Solucionarios</h2>
                        <p class="text-slate-400 text-xs mt-1">Material de repaso oficial para los estudiantes.</p>
                    </div>
                    <button onclick="abrirModalMaterial()" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-5 py-3 rounded-2xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-indigo-600/20">☁️ Publicar Examen</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="grid-materiales-admin">
                    ${dbMateriales.map((m, idx) => `
                        <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                    <span class="bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-[10px] px-3 py-1 rounded-full font-black">${m.area}</span>
                                    <span class="text-slate-400 text-xs font-bold">${m.semana}</span>
                                </div>
                                <h4 class="font-bold text-white text-sm mb-4">${m.titulo}</h4>
                            </div>
                            <div class="flex justify-between items-center pt-4 border-t border-slate-800">
                                <a href="${m.examen}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-bold text-xs transition">🔗 Ver Material</a>
                                <button onclick="eliminarMaterial(${idx})" class="text-rose-400 hover:text-rose-300 font-bold p-2">🗑️</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function abrirModalMaterial() {
            let titulo = prompt("Título del Examen o Solucionario:");
            let area = prompt("Área (Área I, Área II, Área III, Área IV o General):", "Área I");
            let semana = prompt("Semana (Ej. Semana 1):", "Semana 1");
            let link = prompt("Enlace del Material (URL):", "https://drive.google.com/...");
            if(titulo && link) {
                dbMateriales.push({ area, semana, titulo, examen: link });
                enviarASpreadsheet("Materiales", [area, semana, titulo, link, "#", "#"]);
                renderAdminMateriales();
            }
        }

        function eliminarMaterial(idx) {
            dbMateriales.splice(idx, 1);
            renderAdminMateriales();
        }

        function initStudentPanel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-role-badge').innerText = "Portal Estudiante";
            document.getElementById('welcome-user').innerText = `Alumno: ${currentUser.apellidos}, ${currentUser.nombres}`;

            document.getElementById('sidebar-menu').innerHTML = `
                <p class="text-[10px] font-black uppercase text-slate-500 tracking-widest px-4 mb-3">Mi Portal</p>
                <button onclick="renderStudentPortal()" class="w-full text-left px-4 py-3 rounded-2xl font-bold text-xs bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 transition flex items-center space-x-3"><span>🎓</span> <span>Mi Portal Académico</span></button>
            `;
            renderStudentPortal();
        }

        function renderStudentPortal() {
            let notasEstudiante = dbNotas.filter(n => n.dni === currentUser.dni);
            let asistenciasEstudiante = dbAsistencias.filter(a => a.dni === currentUser.dni);
            let mats = dbMateriales.filter(m => m.area === currentUser.area || m.area === "General");

            let sumaNotas = notasEstudiante.reduce((acc, curr) => acc + parseFloat(curr.nota), 0);
            let promedioGeneral = notasEstudiante.length > 0 ? (sumaNotas / notasEstudiante.length).toFixed(1) : "0.0";

            document.getElementById('main-content-area').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-black text-white tracking-tight">Portal Personal del Estudiante (Historial 1 - 10)</h2>
                        <p class="text-slate-400 text-xs mt-1">Ciclo Académico 2026</p>
                    </div>
                    <span class="bg-slate-900 border border-slate-800 text-indigo-400 text-xs px-4 py-2 rounded-xl font-bold">📅 11/08/2026</span>
                </div>

                <div class="bg-gradient-to-r from-indigo-900 via-blue-900 to-slate-900 text-white p-8 rounded-[2rem] shadow-2xl mb-8 flex flex-col md:flex-row justify-between items-center gap-6 border border-indigo-500/20">
                    <div>
                        <span class="bg-indigo-500/30 border border-indigo-400/30 text-[10px] font-black px-3.5 py-1 rounded-full">${currentUser.area}</span>
                        <h3 class="text-2xl font-black mt-3">${currentUser.apellidos}, ${currentUser.nombres}</h3>
                        <p class="text-xs text-indigo-200 mt-1">DNI: ${currentUser.dni} | Teléfono: ${currentUser.telefono}</p>
                    </div>
                    <div class="flex items-center space-x-6 bg-slate-950/60 p-5 rounded-2xl border border-slate-800">
                        <div class="text-center px-4 border-r border-slate-800">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Promedio General</p>
                            <p class="text-2xl font-black text-emerald-400 mt-0.5">${promedioGeneral}</p>
                        </div>
                        <div class="text-center px-4">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Ranking en Área</p>
                            <p class="text-2xl font-black text-indigo-400 mt-0.5">#1</p>
                        </div>
                    </div>
                    <button onclick="alert('Generando Boleta Mensual PDF...');" class="bg-white hover:bg-slate-100 text-slate-950 px-6 py-3.5 rounded-2xl font-extrabold text-xs uppercase tracking-wider shadow-xl transition">📥 Descargar Boleta PDF</button>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                    <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800">
                        <h3 class="font-bold text-white text-sm mb-4">📈 Mis Notas Históricas (Semana 1 a 10)</h3>
                        <div class="overflow-x-auto max-h-64">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-950 sticky top-0"><tr class="text-slate-400 font-bold uppercase border-b border-slate-800"><th class="p-3">Semana</th><th class="p-3 text-center">Buenas (50)</th><th class="p-3 text-center">Nota (20)</th><th class="p-3 text-center">Condición</th></tr></thead>
                                <tbody class="divide-y divide-slate-800/60">
                                    ${notasEstudiante.length > 0 ? notasEstudiante.map(n => `
                                        <tr>
                                            <td class="p-3 font-bold text-white">${n.semana}</td>
                                            <td class="p-3 text-center text-slate-300">${n.buenas} / 50</td>
                                            <td class="p-3 text-center font-bold text-indigo-400">${n.nota} / 20</td>
                                            <td class="p-3 text-center"><span class="${parseFloat(n.nota) >= 11 ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'} text-[10px] px-2.5 py-0.5 rounded-full font-bold border">${parseFloat(n.nota) >= 11 ? 'Aprobado' : 'Reforzar'}</span></td>
                                        </tr>
                                    `).join('') : `<tr><td colspan="4" class="p-6 text-center text-slate-500">Aún no hay notas registradas por la tutora.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800">
                        <h3 class="font-bold text-white text-sm mb-4">📅 Historial de Asistencia Diaria</h3>
                        <div class="overflow-x-auto max-h-64">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-950 sticky top-0"><tr class="text-slate-400 font-bold uppercase border-b border-slate-800"><th class="p-3">Fecha</th><th class="p-3">Área</th><th class="p-3 text-right">Estado</th></tr></thead>
                                <tbody class="divide-y divide-slate-800/60">
                                    ${asistenciasEstudiante.length > 0 ? asistenciasEstudiante.map(a => `
                                        <tr>
                                            <td class="p-3 font-bold text-white">${a.fecha}</td>
                                            <td class="p-3 text-slate-400">${a.area}</td>
                                            <td class="p-3 text-right"><span class="bg-emerald-500/10 text-emerald-400 font-bold px-2.5 py-1 rounded-full text-[10px] border border-emerald-500/20">${a.estado}</span></td>
                                        </tr>
                                    `).join('') : `<tr><td colspan="3" class="p-6 text-center text-slate-500">No hay registros de asistencia todavía.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-900/90 p-6 rounded-3xl shadow-lg border border-slate-800">
                    <h3 class="font-bold text-white text-sm mb-1">📚 Exámenes Pasados y Solucionarios de Repaso</h3>
                    <p class="text-[11px] text-slate-400 mb-6">Materiales de estudio publicados por la tutora para reforzar cada semana de preparación.</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        ${mats.length > 0 ? mats.map(m => `
                            <div class="p-5 bg-slate-950 border border-slate-800 rounded-2xl flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 text-[10px] font-black px-2.5 py-0.5 rounded-full">${m.semana}</span>
                                        <span class="text-[10px] text-slate-400 font-bold">${m.area}</span>
                                    </div>
                                    <h4 class="font-bold text-white text-xs mb-3">${m.titulo}</h4>
                                </div>
                                <a href="${m.examen}" target="_blank" class="block text-center bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-xl font-bold text-[11px] uppercase tracking-wider transition">Ver Material</a>
                            </div>
                        `).join('') : `<p class="text-slate-500 text-xs">No hay materiales publicados para tu área todavía.</p>`}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
